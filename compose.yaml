name: juicegao-journal

services:
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      TRUST_PROXY: "true"
      APP_ORIGIN: ${APP_ORIGIN:-}
      ADMIN_SETUP_TOKEN_HASH: ${ADMIN_SETUP_TOKEN_HASH:-}
      QQ_OAUTH_APP_ID: ${QQ_OAUTH_APP_ID:-}
      QQ_OAUTH_APP_KEY: ${QQ_OAUTH_APP_KEY:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
    volumes:
      - journal-data:/app/data
    expose:
      - "3000"
    networks:
      - journal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - journal
    security_opt:
      - no-new-privileges:true

networks:
  journal:

volumes:
  journal-data:
    name: ${JOURNAL_DATA_VOLUME:-juicegao_data}
