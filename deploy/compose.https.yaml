name: juicegao-journal

services:
  app:
    build:
      context: ..
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      TRUST_PROXY: "true"
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your HTTPS domain in .env}
      ADMIN_SETUP_TOKEN_HASH: ${ADMIN_SETUP_TOKEN_HASH:-}
      QQ_OAUTH_APP_ID: ${QQ_OAUTH_APP_ID:-}
      QQ_OAUTH_APP_KEY: ${QQ_OAUTH_APP_KEY:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
    volumes:
      - journal-data:/app/data
    expose:
      - "3000"
    networks:
      - journal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN to your domain in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - journal
    security_opt:
      - no-new-privileges:true

networks:
  journal:

volumes:
  journal-data:
    name: ${JOURNAL_DATA_VOLUME:-juicegao_data}
  caddy-data:
    name: juicegao_caddy_data
  caddy-config:
    name: juicegao_caddy_config
