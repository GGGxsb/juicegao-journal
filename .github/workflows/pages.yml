name: Sync public content and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'static-site/**'
      - 'scripts/pages-*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # The source must expose public APIs; no administrator credentials are used.
    if: ${{ vars.PAGES_SOURCE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read Pages hosting configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Sync public content and referenced uploads
        run: npm run pages:sync
        env:
          PAGES_SOURCE_URL: ${{ vars.PAGES_SOURCE_URL }}
      - name: Build static pages
        run: npm run pages:build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Upload static output only
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-build/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
